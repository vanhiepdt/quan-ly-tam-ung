# nginx host cho hc.ttdt.site — proxy về container quan-ly-tam-ung-app (127.0.0.1:3002).
#
# Không đụng kiemtra / office / ttdt.site. Cổng 3000 và 3001 đã bị chiếm.
#
#   1) DNS A  hc.ttdt.site -> 157.10.199.148  (đã làm)
#   2) cp deploy/nginx/hc.ttdt.site.conf /etc/nginx/sites-available/hc.ttdt.site
#      ln -s /etc/nginx/sites-available/hc.ttdt.site /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   3) certbot --nginx -d hc.ttdt.site
#
# Tệp này cố tình CHỈ có khối 80: certbot cần HTTP-01, rồi tự sinh khối 443.
# ttdt.site đã gửi HSTS includeSubDomains nên trình duyệt từng vào ttdt.site
# sẽ tự ép hc.ttdt.site sang https — phải chạy bước 3 xong thì người dùng mới vào được.

server {
    listen 80;
    listen [::]:80;
    server_name hc.ttdt.site;
    server_tokens off;

    # Hóa đơn PDF/ảnh ~10 MB; Next bodySizeLimit 12mb.
    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
