# Tách riêng để khởi động/tắt editor không đụng PostgreSQL đang sử dụng.
services:
  onlyoffice:
    image: onlyoffice/documentserver:9.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Configure ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
